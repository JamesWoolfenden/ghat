on:
  push:
    branches:
      - master

name: CI
permissions: read-all
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  test:
    env:
      GOTOOLCHAIN: auto
    ## We want to define a strategy for our job
    strategy:
      ## this will contain a matrix of all the combinations
      ## we wish to test again:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]

    ## Defines the platform for each test run
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20

    ## the steps that will be run through for each version and platform
    ## combination
    steps:
      ## checks out our code locally, so we can work with the files
      ## (must run before setup-go so its built-in cache can hash go.sum)
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      ## sets up go based on the version
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Dockerfile Go version matches go.mod
        if: runner.os == 'Linux'
        shell: bash
        run: |
          want=$(awk '/^go /{print $2}' go.mod)
          have=$(grep -oE '^FROM golang:[0-9]+\.[0-9]+(\.[0-9]+)?' Dockerfile | head -1 | sed 's/.*golang://')
          if [ "$want" != "$have" ]; then
            echo "Dockerfile builds with Go '$have' but go.mod requires '$want'" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -coverprofile=./cover.out

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
