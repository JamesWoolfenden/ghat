name: extensions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the extension artifacts to (e.g. v0.1.35)
        required: true
        type: string
  push:
    branches: [master]
    paths:
      - editors/**
      - .github/workflows/release-extensions.yml
  pull_request:
    paths:
      - editors/**
      - .github/workflows/release-extensions.yml

permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: make vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghat-vsix
          path: bin/ghat.vsix

  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0
      - run: make jetbrains-ext
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghat-jetbrains
          path: bin/ghat-jetbrains.zip

  attach:
    if: github.event_name == 'workflow_dispatch'
    needs: [vscode, jetbrains]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attach extension artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid tag: $TAG" >&2
            exit 1
          fi
          gh release upload "$TAG" \
            dist/ghat.vsix dist/ghat-jetbrains.zip \
            --repo "$REPO" --clobber
